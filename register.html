{% extends "base.html" %}{% block body %}<section class="panel auth"><h1>Create account</h1>{% if error %}<p class="error">{{error}}</p>{% endif %}<form method="post" action="/register"><label>Username (3-24 characters)</label><input name="username" pattern="[A-Za-z0-9_]+" minlength="3" maxlength="24" required><label>Password (12+ characters)</label><input type="password" name="password" minlength="12" required><button>Create account</button></form><p>Already registered? <a href="/login">Login</a></p></section>{% endblock %}
